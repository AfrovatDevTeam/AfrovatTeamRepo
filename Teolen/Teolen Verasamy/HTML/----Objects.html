<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Objects in Web Design</title>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; background-color: #f4f4f4; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; max-width: 300px; }
        h2 { color: #d35400; margin-top: 0; }
        .price { font-weight: bold; color: green; }
    </style>
</head>
<body>
    <b><h2>My Favourite Items</h2></b>
    <script>


        const favourite={
            car: "Mini Cooper",
            singer: "Melanie Martinez",
            movie:  "Wicked",
            workout: "Verticle Leg Press",
        }
        document.getElementById("car").innerText=favourite.car;
        document.getElementById("singer").innerText=favourite.singer;
        document.getElementById("movie").innerText=favourite.movie
        document.getElementById("workout").innerText=favourite.workout;
    </script>
    

</body>
</html>
