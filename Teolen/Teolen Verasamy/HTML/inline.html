<!DOCTYPE html>
<html>
<head>
  <style>
    a:link {
      color: blue;
      text-decoration: none;
    }

    a:visited {
      color: purple;
    }

    a:hover {
      color: red;
      text-decoration: underline;
      background-color: darkblue;
    }

    a:active {
      color: green;
    }
    a:active {
      background-color: blue;
      color: white;
      padding: 10px 15px;
      text-decoration: none;
      border-radius: 5px;
    }
    .button{
     background-color: blue;
      color: white;
      padding: 10px 15px;
      text-decoration: none;
      border-radius: 5px;
    }
  </style>
</head>
<body>

  <h2>My Links</h2>

  <a href="https://example.com" class="button">Visit Example</a><br><br>
  <a href="https://google.com">Go to Google</a>

</body>
</html>
