<!DOCTYPE html>
<html>
    <link href="https://fonts.googleapis.com/css2?family=Clicker+Script&display=swap" rel="stylesheet">
<style>
    /* Apply Clicker Script font */
    body {
            font-family: 'Clicker Script', cursive;
            font-size: 24px;
            background-color: #dfad98;
            padding: 20px;
        }
 </style>
<head>
    <title>HTML Course</title>
</head>
 
<body>
    <form action="newPage.html" method="post">
        <div>
          <b><br> <label for="name">Name:</label></b>
            <b><input type="text" id="name" name="userName" required placeholder="User Name"> </div></b>
        <div>
            <b><label for="email">Email:</label></b>
            <input type="email" id="email" name="email"> </div>
        <div>
           <b><br> <label for="complaints">Complaints:</label></b>
            <textarea id="complaints" name="complaints" rows="4" cols="40" maxlength="40" placeholder="complaints"></textarea><br>
            <b><label for="evidence">Evidence</label></b>
            <input type="file" id="evidence" name="evidence">
        <div>
            <br><input type="submit" id="login" name="login"></div>
        
    </form>
</body>
 
</html>
