<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" type="text/css" href="ball.css">
<style>
        /* Container styling */
    .container {
        width: 400px;
        height: 300px;
        margin: 0 auto;
        align-content: center;
        border: 3px solid transparent;
        border-radius: 10px;    
        background-color: transparent;
        overflow: hidden; /* hides animation overflow */
        position: relative;
    }
    .animate{
        width: 50px;
        height: 50px;
        background-color: black;
        border-radius: 50%;
        position: absolute;
       animation: move 100s infinite;
       animation-duration: 4s;
    }
    .animate:hover{
        animation-play-state:paused;
        background-image: url(./face.jpg);
        body {
            background-color: #333;
        }
    }
    @keyframes move {
        0%{
            top: 10px;
            left:5px;
        }
        25%{
                top: 10px;
                left:345px;
            }
        50%{
            top: 245px;
            left:345px;
        }
        75%{
            top: 245px;
            left:5px;
        }
        100%{
            top: 10px;
            left:5px;
        }
    }
</style>
</head>
<h1 class="center">Catch The Ball</h1>
<body class="center">
    <b><p>*Viewer Disclaimer: Some contents may be disturbing*</p></b>
    <u><h3>Instructions:</h3></u>   
    <P>You will need to "Catch" the ball</p><br>
       
        <div class="container">
            <div class="animate"></div>
        </div>   
</body>

</html>
