<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FT Luxury Hotel - Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="animated-bg">
    <div class="dashboard-container" id="dashboardContainer">
        <h1>Welcome, <span id="userDisplay"></span>!</h1>
        <p>Your exclusive FT Luxury Hotel dashboard.</p>
        <div class="dashboard-cards">
            <div class="card">
                <img src="hotel rooms 3.jpg" alt="Rooms">
                <h3>Rooms</h3>
            </div>
            <div class="card">
                <img src="spa and wellness 2.jpg" alt="Spa & Wellness">
                <h3>Spa & Wellness</h3>
            </div>
            <div class="card">
                <img src="fine dining 1.jpg" alt="Fine Dining">
                <h3>Fine Dining</h3>
            </div>
        </div>
        <button id="logoutBtn">Logout</button>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
